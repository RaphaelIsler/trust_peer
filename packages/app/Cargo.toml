[package]
name = "app"
version = "0.1.0"
edition = "2021"

[dependencies]
dioxus = { workspace = true, features = ["fullstack"] }
core_types = { path = "../core_types" }
crypto = { path = "../crypto", optional = true }
blockchain = { path = "../blockchain", optional = true }
db = { path = "../db", optional = true }
api = { path = "../api" }
p2p_webrtc = { path = "../p2p_webrtc", optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
hex = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
sqlx = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
helper = { workspace = true, features = ["uuid", "sqlx", "service"], optional = true }
uuid = { workspace = true, features = ["v4"] }

[features]
default = []
server = ["dioxus/server", "tokio", "crypto", "blockchain"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop", "chrono", "tokio", "p2p_webrtc", "db", "blockchain", "crypto", "sqlx", "thiserror", "helper", "core_types/desktop"]
mobile = ["dioxus/mobile", "chrono", "tokio", "p2p_webrtc", "db", "blockchain", "crypto", "sqlx", "thiserror", "helper", "core_types/mobile"]

# Multiple binaries for different platforms
[[bin]]
name = "server"
path = "src/bin/server.rs"
required-features = ["server"]

[[bin]]
name = "web"
path = "src/bin/web.rs"
required-features = ["web"]

[[bin]]
name = "desktop"
path = "src/bin/desktop.rs"
required-features = ["desktop"]

[[bin]]
name = "mobile"
path = "src/bin/mobile.rs"
required-features = ["mobile"]
