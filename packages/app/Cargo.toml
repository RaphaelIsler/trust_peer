[package]
name = "app"
version = "0.1.0"
edition = "2021"

[dependencies]
dioxus = { workspace = true, features = ["fullstack"] }
crypto = { path = "../crypto", optional = true }
blockchain = { path = "../blockchain", optional = true }
db = { path = "../db", optional = true }
p2p_webrtc = { path = "../p2p_webrtc", optional = true }
serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0"
tokio = { version = "1.42", features = ["full"], optional = true }
chrono = { version = "0.4", features = ["serde"], optional = true }
log = "0.4"
env_logger = "0.11"
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "chrono"], optional = true }
thiserror = { version = "2.0", optional = true }
helper = { git = "https://bitbucket.org/revwork/rust_helper.git", package = "rust_helper", features = ["uuid", "sqlx"], optional = true }
uuid = { version = "1.0", features = ["v4"] }

[features]
default = []
server = ["dioxus/server", "tokio", "crypto", "blockchain"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop", "chrono", "tokio", "p2p_webrtc", "db", "blockchain", "crypto", "sqlx", "thiserror", "helper"]
mobile = ["dioxus/mobile", "chrono", "tokio", "p2p_webrtc", "db", "blockchain", "crypto", "sqlx", "thiserror", "helper"]

# Multiple binaries for different platforms
[[bin]]
name = "server"
path = "src/bin/server.rs"
required-features = ["server"]

[[bin]]
name = "web"
path = "src/bin/web.rs"
required-features = ["web"]

[[bin]]
name = "desktop"
path = "src/bin/desktop.rs"
required-features = ["desktop"]

[[bin]]
name = "mobile"
path = "src/bin/mobile.rs"
required-features = ["mobile"]
