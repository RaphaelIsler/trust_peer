[package]
name = "weakup"
version = "0.1.0"
edition = "2021"

[dependencies]
api = { path = "../api" }
axum = "0.7"
jsonwebtoken = "9"
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
