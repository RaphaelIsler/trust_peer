[package]
name = "users"
version = "0.1.0"
edition = "2021"

[dependencies]
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "chrono"] }
serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0"
thiserror = "2.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4"] }
hex = "0.4"
helper = { git = "https://bitbucket.org/revwork/rust_helper.git", package = "rust_helper", features = ["uuid", "sqlx"] }
crypto = { path = "../crypto" }
blockchain = { path = "../blockchain" }
db = { path = "../db" }
