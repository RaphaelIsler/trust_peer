[package]
name = "blockchain"
version = "0.1.0"
edition = "2021"

[dependencies]
crypto = { path = "../crypto" }
ui = { workspace = true }
helper = { git = "https://bitbucket.org/revwork/rust_helper.git", package = "rust_helper", features=["uuid", "backend"] }
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
hex = "0.4"
bincode = "1.3"
rand = "0.8"
chrono = "0.4"
anyhow = "1.0"
[features]
default = []
