[package]
name = "p2p_webrtc"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.23"
webrtc = "0.9"
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.11"
uuid = { version = "1.0", features = ["v4", "serde"] }
futures-util = "0.3"
parking_lot = "0.12"
async-trait = "0.1"
bytes = "1.0"

[dev-dependencies]
tokio-test = "0.4"

[features]
default = ["mobile"]
mobile = []
desktop = []

[[bin]]
name = "signaling_server"
path = "src/bin/signaling_server.rs"

[[example]]
name = "p2p_demo"
path = "examples/p2p_demo.rs"
