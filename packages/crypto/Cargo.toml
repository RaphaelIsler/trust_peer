[package]
name = "crypto"
version = "0.1.0"
edition = "2021"

[dependencies]
sha3 = { workspace = true }
hex = { workspace = true }
sqlx = { workspace = true }
rand = { workspace = true }
rand_core = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
anyhow = { workspace = true }
serde = { workspace = true }
sha2 = { workspace = true }
db = { path = "../db" }
helper = { workspace = true, features = ["uuid", "sqlx"] }

# ed25519 is an optional feature (enabled by default)
ed25519-dalek = { workspace = true, optional = true }
x25519-dalek = { workspace = true, optional = true, features = ["static_secrets"] }
curve25519-dalek = { workspace = true, optional = true }
hkdf = { workspace = true, optional = true }
chacha20poly1305 = { workspace = true, optional = true }

# optional post-quantum support (requires liboqs/tooling to be available at build)
oqs = { workspace = true, optional = true }

[features]
default = ["ed25519"]
ed25519 = ["ed25519-dalek", "x25519-dalek", "curve25519-dalek", "hkdf", "chacha20poly1305"]
pq = ["oqs"]

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
