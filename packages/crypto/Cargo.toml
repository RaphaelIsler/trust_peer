[package]
name = "crypto"
version = "0.1.0"
edition = "2021"

[dependencies]
sha3 = "0.10"
hex = "0.4"
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio"] }
rand = "0.8"
rand_core = "0.6"
uuid = { version = "1.11", features = ["v4"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
db = { path = "../db" }

# ed25519 is an optional feature (enabled by default)
ed25519-dalek = { version = "2.1", optional = true }
x25519-dalek = { version = "2.0", optional = true }
curve25519-dalek = { version = "4.1", optional = true }
hkdf = { version = "0.12", optional = true }
chacha20poly1305 = { version = "0.10", optional = true }

# optional post-quantum support (requires liboqs/tooling to be available at build)
oqs = { version = "0.6", optional = true }

[features]
default = ["ed25519"]
ed25519 = ["ed25519-dalek", "x25519-dalek", "curve25519-dalek", "hkdf", "chacha20poly1305"]
pq = ["oqs"]

[dev-dependencies]
tempfile = "3.14"
tokio = { version = "1.42", features = ["macros", "rt-multi-thread"] }
