[workspace]
resolver = "2"
members = [
    "packages/app",
    "packages/api",
    "packages/blockchain",
    "packages/core_types",
    "packages/crypto",
    "packages/coordinator",
    "packages/db",
    "packages/p2p_webrtc",
    "packages/weakup"
]

[workspace.dependencies]
dioxus = { version = "0.7.1" }
anyhow = "1.0"
async-trait = "0.1"
axum = "0.7"
bincode = "1.3"
bytes = "1.0"
chacha20poly1305 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
curve25519-dalek = "4.1"
ed25519-dalek = "2.1"
env_logger = "0.11"
futures-util = "0.3"
helper = { git = "https://bitbucket.org/revwork/rust_helper.git", package = "rust_helper" }
hex = "0.4"
hkdf = "0.12"
jsonwebtoken = "9"
log = "0.4"
oqs = "0.6"
parking_lot = "0.12"
rand = "0.8"
rand_core = "0.6"
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sha3 = "0.10"
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "chrono"] }
tempfile = "3.14"
thiserror = "2.0"
tokio = { version = "1.42", features = ["full"] }
tokio-test = "0.4"
tokio-tungstenite = "0.23"
uuid = { version = "1.11", features = ["v4", "serde"] }
webrtc = "0.9"
x25519-dalek = "2.0"
